name: Bug report
description: 报告 Tap KV 的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要说明你遇到了什么问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按步骤描述如何复现。
      placeholder: |
        1. 打开页面
        2. 上传图片
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 浏览器、系统、设备尺寸等。
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 请不要上传真实 API Key 或敏感日志。
